<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokerogue × 도통초</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0a0a12;
    color:#f0f0f0;
    font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* 피카츄 윙크 배경 */
  .bg{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(255,204,0,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 30% 80%, rgba(255,100,100,0.08) 0%, transparent 50%),
      #0a0a12;
    z-index:0;
  }
  .bg::after{
    content:'⚡';
    position:absolute;right:8%;top:12%;
    font-size:120px;opacity:0.07;
    transform:rotate(15deg);
  }
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px}
  .card{
    background:rgba(20,20,32,0.92);
    border:2px solid #3a3a55;
    border-radius:18px;
    padding:20px;
    margin-bottom:14px;
    box-shadow:0 0 0 1px #1a1a28, 0 12px 40px rgba(0,0,0,0.5);
  }
  h1{font-size:1.35rem;color:#ffcc00;margin-bottom:4px;text-shadow:0 0 12px rgba(255,204,0,0.3)}
  .sub{font-size:.8rem;color:#888;margin-bottom:16px}
  input,select,textarea{
    width:100%;padding:11px 13px;margin-bottom:9px;
    border:2px solid #333;border-radius:10px;
    background:#12121c;color:#fff;font-size:.95rem;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:#ffcc00}
  button{
    width:100%;padding:13px;border:none;border-radius:12px;
    font-weight:700;font-size:.95rem;cursor:pointer;
    transition:transform .12s, filter .12s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  button:hover{transform:translateY(-1px);filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-yellow{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#1a1a00}
  .btn-red{background:linear-gradient(135deg,#ff5555,#cc2222);color:#fff}
  .btn-blue{background:linear-gradient(135deg,#55aaff,#2266cc);color:#fff}
  .btn-green{background:linear-gradient(135deg,#55cc77,#228844);color:#fff}
  .btn-purple{background:linear-gradient(135deg,#aa66ff,#6633cc);color:#fff}
  .btn-pink{background:linear-gradient(135deg,#ff66aa,#cc3388);color:#fff}
  .btn-orange{background:linear-gradient(135deg,#ff9944,#cc6622);color:#fff}
  .btn-arceus{
    background:linear-gradient(90deg,#ff0000,#ff9900,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);
    background-size:200% 100%;
    animation:rainbow 3s linear infinite;
    color:#fff;text-shadow:0 1px 3px #000;
    border:2px solid #fff;
  }
  @keyframes rainbow{0%{background-position:0%}100%{background-position:200%}}
  .hidden{display:none}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .userbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.88rem}
  .status{margin-top:10px;padding:10px;border-radius:10px;background:#12121c;font-size:.82rem;color:#aaa;min-height:36px}
  .green{color:#4ade80}.red{color:#f87171}.yellow{color:#ffcc00}
  .timer{font-size:1.15rem;font-weight:700;color:#ffcc00;margin:6px 0}
  .tag{display:inline-block;background:#252530;padding:3px 9px;border-radius:8px;margin:2px;font-size:.75rem}
  .tag.on{background:#2d6a4f;color:#a7f3d0}
  .dev-zone,.dotong-zone{border:2px solid #3a3a55;padding:14px;border-radius:14px;margin-top:12px}
  .dev-zone{border-color:#ffcc00}
  .dotong-zone{border-color:#55aaff}
  label{font-size:.82rem;color:#aaa;display:block;margin-bottom:4px}
  .poke-icon{font-size:1.3rem}
  .pending-card{background:#1a1a28;border:1px solid #444;border-radius:10px;padding:10px;margin-bottom:8px;font-size:.85rem}
  .pending-card b{color:#ffcc00}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

  <!-- AUTH -->
  <div id="authCard" class="card">
    <h1>⚡ Pokerogue × 도통초</h1>
    <div class="sub">피카츄가 윙크하는 중...</div>
    <input id="nick" placeholder="아이디">
    <input id="pass" type="password" placeholder="비밀번호">
    <div class="row">
      <button class="btn-yellow" onclick="register()">회원가입</button>
      <button class="btn-blue" onclick="login()">로그인</button>
    </div>
    <div id="authStatus" class="status"></div>
  </div>

  <!-- MAIN -->
  <div id="mainCard" class="card hidden">
    <div class="userbar">
      <span>환영, <b id="dispNick"></b>
        <span id="devBadge" class="tag" style="display:none;background:#ffcc00;color:#000">DEV</span>
        <span id="dotongBadge" class="tag" style="display:none;background:#55aaff;color:#fff">도통초</span>
      </span>
      <button class="btn-red" style="width:auto;padding:5px 12px;font-size:.78rem" onclick="logout()">로그아웃</button>
    </div>

    <!-- TIMER -->
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div style="font-size:.8rem;color:#888">사이트 체류 시간</div>
      <div class="timer" id="playTimer">00:00:00</div>
      <div id="unlockList"></div>
    </div>

    <!-- NORMAL -->
    <div id="normalZone">
      <h3 style="margin-bottom:10px;color:#ffcc00">일반 치트</h3>
      <label>레벨 설정 (최대 999) — 일 10회</label>
      <div class="row">
        <input id="levelVal" type="number" min="1" max="999" value="50">
        <button class="btn-yellow" id="btnLevel" onclick="useLevel()" style="flex:0 0 120px">⚡ 적용 (<span id="leftLevel">10</span>)</button>
      </div>
      <label>볼 99개 — 일 3회</label>
      <button class="btn-red" id="btnBalls" onclick="useBalls()">🔴 볼 99개 (<span id="leftBalls">3</span>)</button>

      <div id="feat1" class="hidden" style="margin-top:12px">
        <label>원시 포켓몬 — 일 20회</label>
        <div class="row">
          <input id="primalId" placeholder="포켓몬 ID">
          <button class="btn-orange" id="btnPrimal" onclick="usePrimal()" style="flex:0 0 120px">🔥 적용 (<span id="leftPrimal">20</span>)</button>
        </div>
      </div>
      <div id="feat2" class="hidden" style="margin-top:12px">
        <label>캐릭터 추가 — 일 1회</label>
        <div class="row">
          <input id="addId" placeholder="포켓몬 ID">
          <button class="btn-green" id="btnAdd" onclick="useAdd()" style="flex:0 0 120px">➕ 추가 (<span id="leftAdd">1</span>)</button>
        </div>
      </div>
      <div id="feat3" class="hidden" style="margin-top:12px">
        <label>이로치 만들기</label>
        <div class="row">
          <input id="shinyId" placeholder="포켓몬 ID">
          <button class="btn-purple" onclick="useShiny()" style="flex:0 0 120px">✨ 이로치</button>
        </div>
      </div>
    </div>

    <!-- 도통초 신청 -->
    <div id="dotongApply" class="card" style="margin-top:14px;padding:14px">
      <h3 style="color:#55aaff;margin-bottom:8px">🏫 도통초 모드 신청</h3>
      <input id="dtName" placeholder="이름">
      <div class="row">
        <input id="dtClass" placeholder="반 (예: 1)">
        <input id="dtNum" placeholder="번호">
      </div>
      <button class="btn-blue" onclick="applyDotong()">신청하기</button>
      <div id="dtStatus" class="status"></div>
    </div>

    <!-- 도통초 승인된 유저 존 -->
    <div id="dotongZone" class="dotong-zone hidden">
      <h3 style="color:#55aaff;margin-bottom:8px">🏫 도통초 모드 (일 5회)</h3>
      <button class="btn-yellow" onclick="dtUnlockAll()">⚡ Unlock All (<span id="dtLeft">5</span>)</button>
      <button class="btn-red" style="margin-top:6px" onclick="dtVoucher()">🔴 Voucher 999</button>
      <button class="btn-blue" style="margin-top:6px" onclick="dtMoney()">💰 Money 맥스</button>
      <button class="btn-green" style="margin-top:6px" onclick="dtBalls()">🎾 볼 맥스</button>
      <button class="btn-purple" style="margin-top:6px" onclick="dtRequestMore()">📩 추가 요청하기</button>
    </div>

    <!-- 개발자 진입 -->
    <button class="btn-arceus" style="margin-top:14px" onclick="toggleDevPrompt()">🌈 아르세우스 — 개발자 모드</button>
    <div id="devPrompt" class="hidden" style="margin-top:8px">
      <input id="devPass" type="password" placeholder="개발자 비밀번호">
      <button class="btn-arceus" onclick="enterDev()">확인</button>
    </div>

    <!-- DEV ZONE -->
    <div id="devZone" class="dev-zone hidden">
      <h3 style="color:#ffcc00;margin-bottom:10px">🌈 개발자 공간</h3>
      <button class="btn-yellow" onclick="devUnlockAll()">⚡ Unlock All + Max</button>
      <button class="btn-red" style="margin-top:6px" onclick="devVoucher()">🔴 Voucher 9999</button>
      <button class="btn-blue" style="margin-top:6px" onclick="devMoney()">💰 Money 99999999</button>
      <button class="btn-green" style="margin-top:6px" onclick="devBalls()">🎾 Master Ball 999</button>
      <button class="btn-orange" style="margin-top:6px" onclick="devEggs()">🥚 Legendary Egg 100</button>
      <button class="btn-purple" style="margin-top:6px" onclick="devLevel()">📈 파티 레벨 999</button>
      <button class="btn-pink" style="margin-top:6px" onclick="devShinyAll()">✨ 모든 스타터 이로치</button>
      <button class="btn-red" style="margin-top:6px" onclick="devWipe()">💀 세이브 삭제</button>

      <hr style="border-color:#333;margin:14px 0">
      <h4 style="color:#55aaff;margin-bottom:8px">🏫 도통초 승인 관리</h4>
      <div id="pendingList"></div>
      <div id="bannedList" style="margin-top:10px"></div>
    </div>

    <div id="mainStatus" class="status">버튼을 누르면 콘솔 코드가 복사됩니다.</div>
  </div>
</div>

<script>
const USERS='pr_users_v3', SESSION='pr_session_v3', PLAY='pr_play_', LIMITS='pr_limits_', PENDING='pr_pending', BANNED='pr_banned', DT_USES='pr_dt_uses';

function getUsers(){return JSON.parse(localStorage.getItem(USERS)||'{}')}
function saveUsers(u){localStorage.setItem(USERS,JSON.stringify(u))}
function getPending(){return JSON.parse(localStorage.getItem(PENDING)||'[]')}
function savePending(p){localStorage.setItem(PENDING,JSON.stringify(p))}
function getBanned(){return JSON.parse(localStorage.getItem(BANNED)||'{}')}
function saveBanned(b){localStorage.setItem(BANNED,JSON.stringify(b))}
function getLimits(nick){
  const all=JSON.parse(localStorage.getItem(LIMITS)||'{}');
  const today=new Date().toISOString().slice(0,10);
  if(!all[nick]||all[nick].date!==today){all[nick]={date:today,level:10,balls:3,primal:20,add:1};localStorage.setItem(LIMITS,JSON.stringify(all))}
  return all[nick];
}
function saveLimits(nick,l){const all=JSON.parse(localStorage.getItem(LIMITS)||'{}');all[nick]=l;localStorage.setItem(LIMITS,JSON.stringify(all))}
function getDtUses(nick){
  const all=JSON.parse(localStorage.getItem(DT_USES)||'{}');
  const today=new Date().toISOString().slice(0,10);
  if(!all[nick]||all[nick].date!==today){all[nick]={date:today,left:5};localStorage.setItem(DT_USES,JSON.stringify(all))}
  return all[nick];
}
function saveDtUses(nick,d){const all=JSON.parse(localStorage.getItem(DT_USES)||'{}');all[nick]=d;localStorage.setItem(DT_USES,JSON.stringify(all))}

function setS(id,msg,ok){document.getElementById(id).innerHTML=`<span class="\( {ok?'green':ok===false?'red':'yellow'}"> \){msg}</span>`}

function register(){
  const n=document.getElementById('nick').value.trim(),p=document.getElementById('pass').value;
  if(!n||!p)return setS('authStatus','아이디/비번 채워라');
  const u=getUsers();
  if(u[n])return setS('authStatus','이미 있는 아이디');
  u[n]={pass:btoa(p),created:Date.now(),role:'user'};
  saveUsers(u);
  setS('authStatus','가입 완료',true);
}
function login(){
  const n=document.getElementById('nick').value.trim(),p=document.getElementById('pass').value;
  const banned=getBanned();
  if(banned[n] && banned[n]>Date.now())return setS('authStatus','차단된 계정임. 나중에 다시 와',false);
  const u=getUsers();
  if(!u[n]||u[n].pass!==btoa(p))return setS('authStatus','아이디 or 비번 틀림',false);
  localStorage.setItem(SESSION,n);
  if(!localStorage.getItem(PLAY+n))localStorage.setItem(PLAY+n,Date.now());
  showMain(n);
}
function logout(){localStorage.removeItem(SESSION);location.reload()}

function showMain(nick){
  document.getElementById('authCard').classList.add('hidden');
  document.getElementById('mainCard').classList.remove('hidden');
  document.getElementById('dispNick').textContent=nick;
  const u=getUsers()[nick];
  if(u.role==='dev'){document.getElementById('devBadge').style.display='inline-block';document.getElementById('devZone').classList.remove('hidden')}
  if(u.role==='dotong'){document.getElementById('dotongBadge').style.display='inline-block';document.getElementById('dotongZone').classList.remove('hidden');document.getElementById('dotongApply').classList.add('hidden');updateDtLeft(nick)}
  updateLimits(nick);startTimer(nick);if(u.role==='dev')renderPending();
}

function updateLimits(nick){
  const l=getLimits(nick);
  document.getElementById('leftLevel').textContent=l.level;
  document.getElementById('leftBalls').textContent=l.balls;
  document.getElementById('leftPrimal').textContent=l.primal;
  document.getElementById('leftAdd').textContent=l.add;
  document.getElementById('btnLevel').disabled=l.level<=0;
  document.getElementById('btnBalls').disabled=l.balls<=0;
  document.getElementById('btnPrimal').disabled=l.primal<=0;
  document.getElementById('btnAdd').disabled=l.add<=0;
}
function updateDtLeft(nick){
  const d=getDtUses(nick);
  document.getElementById('dtLeft').textContent=d.left;
}

function startTimer(nick){
  const start=+localStorage.getItem(PLAY+nick)||Date.now();
  function tick(){
    const sec=Math.floor((Date.now()-start)/1000);
    const h=String(Math.floor(sec/3600)).padStart(2,'0');
    const m=String(Math.floor((sec%3600)/60)).padStart(2,'0');
    const s=String(sec%60).padStart(2,'0');
    document.getElementById('playTimer').textContent=`\( {h}: \){m}:${s}`;
    const mins=Math.floor(sec/60);
    let html='';
    [{t:10,n:'원시 포켓몬'},{t:20,n:'캐릭터 추가'},{t:30,n:'이로치'}].forEach((f,i)=>{
      const on=mins>=f.t;
      html+=`<span class="tag \( {on?'on':''}"> \){f.n} ${on?'해금':'잠김'}</span>`;
      document.getElementById('feat'+(i+1)).classList.toggle('hidden',!on);
    });
    document.getElementById('unlockList').innerHTML=html;
  }
  tick();setInterval(tick,1000);
}

function copy(code){navigator.clipboard.writeText(code).then(()=>setS('mainStatus','복사 완료! 게임 콘솔에 붙여넣기',true))}

// normal
function useLevel(){const nick=localStorage.getItem(SESSION);const l=getLimits(nick);if(l.level<=0)return;const v=Math.min(999,+document.getElementById('levelVal').value||50);l.level--;saveLimits(nick,l);updateLimits(nick);copy(`this.scene.party.forEach(p=>{p.level=${v};});console.log("Level ${v}");`)}
function useBalls(){const nick=localStorage.getItem(SESSION);const l=getLimits(nick);if(l.balls<=0)return;l.balls--;saveLimits(nick,l);updateLimits(nick);copy(`this.scene.pokeballCounts={0:99,1:99,2:99,3:99,4:99};console.log("Balls 99");`)}
function usePrimal(){const nick=localStorage.getItem(SESSION);const l=getLimits(nick);if(l.primal<=0)return;const id=+document.getElementById('primalId').value;if(!id)return;l.primal--;saveLimits(nick,l);updateLimits(nick);copy(`this.scene.gameData.starterData[\( {id}]={abilityAttr:7,candyCount:200,eggMoves:15,friendship:255,passiveAttr:3,valueReduction:2};this.scene.gameData.dexData[ \){id}]={caughtAttr:255n,ivs:[31,31,31,31,31,31],seenAttr:479n,caughtCount:10,hatchedCount:10,seenCount:10,natureAttr:67108862};console.log("Primal ${id}");`)}
function useAdd(){const nick=localStorage.getItem(SESSION);const l=getLimits(nick);if(l.add<=0)return;const id=+document.getElementById('addId').value;if(!id)return;l.add--;saveLimits(nick,l);updateLimits(nick);copy(`this.scene.gameData.starterData[\( {id}]={abilityAttr:7,candyCount:50,eggMoves:15,friendship:50,passiveAttr:1,valueReduction:0};this.scene.gameData.dexData[ \){id}]={caughtAttr:255n,ivs:[31,31,31,31,31,31],seenAttr:479n,caughtCount:1,hatchedCount:0,seenCount:1,natureAttr:67108862};console.log("Added ${id}");`)}
function useShiny(){const id=+document.getElementById('shinyId').value;if(!id)return;copy(`this.scene.gameData.dexData[\( {id}].caughtAttr=255n;this.scene.gameData.dexData[ \){id}].seenAttr=479n;console.log("Shiny ${id}");`)}

// 도통초 신청
function applyDotong(){
  const nick=localStorage.getItem(SESSION);
  const name=document.getElementById('dtName').value.trim();
  const cls=document.getElementById('dtClass').value.trim();
  const num=document.getElementById('dtNum').value.trim();
  if(!name||!cls||!num)return setS('dtStatus','다 채워라',false);
  const banned=getBanned();
  if(banned[nick]&&banned[nick]>Date.now())return setS('dtStatus','차단된 계정',false);
  const pending=getPending();
  if(pending.find(p=>p.nick===nick))return setS('dtStatus','이미 신청함. 대기 중',false);
  const u=getUsers()[nick];
  pending.push({nick,name,cls,num,pass:u.pass,time:Date.now()});
  savePending(pending);
  setS('dtStatus','신청 완료. 개발자 승인 기다리는 중...',true);
}

// 도통초 기능
function dtUse(fn){
  const nick=localStorage.getItem(SESSION);
  const d=getDtUses(nick);
  if(d.left<=0)return setS('mainStatus','오늘 횟수 다 씀. 추가 요청해',false);
  d.left--;saveDtUses(nick,d);updateDtLeft(nick);fn();
}
function dtUnlockAll(){dtUse(()=>copy(`for(let i=1;i<=1025;i++){this.scene.gameData.starterData[i]={abilityAttr:7,candyCount:200,eggMoves:15,friendship:255,passiveAttr:3,valueReduction:2};this.scene.gameData.dexData[i]={caughtAttr:255n,ivs:[31,31,31,31,31,31],seenAttr:479n,caughtCount:50,hatchedCount:50,seenCount:50,natureAttr:67108862};}console.log("DT Unlock All");`))}
function dtVoucher(){dtUse(()=>copy(`this.scene.gameData.voucherCounts=[999,999,999,999];console.log("DT Voucher");`))}
function dtMoney(){dtUse(()=>copy(`this.scene.money=99999999;console.log("DT Money");`))}
function dtBalls(){dtUse(()=>copy(`this.scene.pokeballCounts={0:999,1:999,2:999,3:999,4:999};console.log("DT Balls");`))}
function dtRequestMore(){setS('mainStatus','추가 요청 보냄. 개발자가 확인하면 풀어줌',true);const reqs=JSON.parse(localStorage.getItem('pr_dt_req')||'[]');reqs.push({nick:localStorage.getItem(SESSION),time:Date.now()});localStorage.setItem('pr_dt_req',JSON.stringify(reqs))}

// DEV
function toggleDevPrompt(){document.getElementById('devPrompt').classList.toggle('hidden')}
function enterDev(){
  if(document.getElementById('devPass').value!=='qwertity8787')return setS('mainStatus','비번 틀림',false);
  const nick=localStorage.getItem(SESSION);
  const u=getUsers();u[nick].role='dev';saveUsers(u);
  document.getElementById('devZone').classList.remove('hidden');
  document.getElementById('devBadge').style.display='inline-block';
  document.getElementById('devPrompt').classList.add('hidden');
  renderPending();
  setS('mainStatus','개발자 모드 진입',true);
}
function renderPending(){
  const pending=getPending();
  const banned=getBanned();
  let html='';
  if(!pending.length)html='<div style="color:#666;font-size:.85rem">대기 중인 신청 없음</div>';
  pending.forEach((p,i)=>{
    html+=`<div class="pending-card">
      <b>\( {p.name}</b> ( \){p.cls}반 ${p.num}번) — 아이디: ${p.nick}<br>
      비번(디코드): ${atob(p.pass)}
      <div class="row" style="margin-top:6px">
        <button class="btn-green" onclick="approve(${i})">승인</button>
        <button class="btn-orange" onclick="reject(${i})">거절</button>
        <button class="btn-red" onclick="banUser('\( {p.nick}', \){i})">차단</button>
      </div>
    </div>`;
  });
  document.getElementById('pendingList').innerHTML=html;

  let bhtml='<div style="font-size:.85rem;color:#888;margin-bottom:4px">차단 목록</div>';
  Object.keys(banned).forEach(n=>{
    if(banned[n]>Date.now())bhtml+=`<div class="pending-card">\( {n} — <button class="btn-green" style="width:auto;padding:4px 10px" onclick="unban(' \){n}')">풀기</button></div>`;
  });
  document.getElementById('bannedList').innerHTML=bhtml;
}
function approve(i){
  const pending=getPending();
  const p=pending[i];
  const u=getUsers();u[p.nick].role='dotong';saveUsers(u);
  pending.splice(i,1);savePending(pending);
  renderPending();
  setS('mainStatus',`${p.name} 승인 완료`,true);
}
function reject(i){const pending=getPending();pending.splice(i,1);savePending(pending);renderPending();setS('mainStatus','거절함',false)}
function banUser(nick,i){
  const banned=getBanned();
  banned[nick]=Date.now()+7*24*60*60*1000; // 7일
  saveBanned(banned);
  const pending=getPending();pending.splice(i,1);savePending(pending);
  renderPending();
  setS('mainStatus',`${nick} 7일 차단`,false);
}
function unban(nick){const banned=getBanned();delete banned[nick];saveBanned(banned);renderPending();setS('mainStatus',`${nick} 차단 해제`,true)}
